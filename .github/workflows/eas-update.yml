name: Publish Android preview update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check Expo and app configuration
        id: update-config
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
        run: |
          if [[ -n "$EXPO_TOKEN" && -n "$EXPO_PROJECT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Expo Update skipped until EXPO_TOKEN and EXPO_PROJECT_ID are configured."
          fi

      - uses: expo/expo-github-action@v8
        if: steps.update-config.outputs.ready == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
        if: steps.update-config.outputs.ready == 'true'

      - name: Publish update to Android preview app
        if: steps.update-config.outputs.ready == 'true'
        run: eas update --channel preview --environment preview --message "main $GITHUB_SHA" --non-interactive
        env:
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
